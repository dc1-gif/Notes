name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug > build.log 2>&1 || {
            grep -n -A15 "What went wrong" build.log | head -50
            echo "-----"
            L=$(grep -n "gradlew failed" build.log | head -1 | cut -d: -f1)
            sed -n "$((L-40)),$((L))p" build.log
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: listapp-apk
          path: bin/*.apk
